[project]
name = "langgraph-ollama-hands-on"
version = "0.1.0"
description = "Minimal but production-shaped LangGraph + Ollama agent: memory, tools, loop guards, tracing."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Ollama daemon (deselect with -m 'not integration')",
]
